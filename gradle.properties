org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx12g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx8g -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC
kotlin.incremental=false
kotlin.incremental.native=false
kotlin.build.report.output=file
kotlin.build.report.include_compiler_arguments=true
kotlin.native.parallelThreads=0
# Hosts cannot run every native test target (Linux/Windows tests on macOS);
# skip the per-target 'disabled' warnings in local builds.
kotlin.native.ignoreDisabledTargets=true

# Project coordinates and layout
project.group=io.github.kotlinmania
project.version=0.1.1
project.name=uds-windows-kotlin
project.frameworkName=UdsWindows
project.namespace=io.github.kotlinmania.udswindows

# Maven resolution mode and the local repository path are configured in maven.properties.
# Standalone artifact verification and VM runtime settings are configured in verifier.properties.

# POM Metadata
project.pom.description=Kotlin Multiplatform port template
project.pom.licenseName=MIT
project.pom.licenseUrl=https://opensource.org/licenses/MIT


# Feature imports
project.features=
# Windows-only crate (#![cfg(windows)]): non-Windows targets opt out explicitly (BUILD_TARGETS.md Profile 3).
project.target.android=false
project.target.macosArm64=false
project.target.iosArm64=false
project.target.iosSimulatorArm64=false
project.target.tvosArm64=false
project.target.tvosSimulatorArm64=false
project.target.watchosDeviceArm64=false
project.target.watchosSimulatorArm64=false
project.target.linuxX64=false
project.target.linuxArm64=false
project.target.androidNativeArm64=false
project.target.androidNativeX64=false
project.target.wasmJs=false
project.target.wasmWasi=false
project.test.extraTasks=
project.dependencies.commonMainBundle=uds-windows-commonMain
project.dependencies.commonTestBundle=
project.dependencies.commonBenchmarkBundle=
project.benchmark.targets=
project.benchmark.warmups=3
project.benchmark.iterations=5
project.benchmark.iterationTime=1
project.benchmark.iterationTimeUnit=s

# ============================================================================
# Version catalog (build logic reads these instead of hardcoding literals)
# ============================================================================

# Kotlin / Plugins
versions.kotlin=2.4.21
versions.intellij.coroutines=1.10.2-intellij-1
versions.android.plugin=9.4.1

# JVM toolchain
jvm.toolchain=21

# Android SDK pins
android.commandLineTools.revision=16111833
android.compileSdk=34
android.minSdk=24
android.buildTools=36.0.0

# Node/Yarn toolchains
# V8 heap (MB) for every Node process: JS/Wasm test runners and webpack.
node.maxOldSpaceSizeMb=4096
node.version=24.22.0
wasm.node.version=24.22.0
yarn.version=1.22.22
wasm.yarn.version=1.22.22

# Yarn security resolutions
yarn.resolution.diff=8.0.3
yarn.resolution.fast-uri=3.1.9
yarn.resolution.serialize-javascript=7.0.5
# webpack resolution is sourced from kotlin-js-store/package.json in
# build.gradle.kts (Dependabot-managed); do not pin it here.
yarn.resolution.@types/estree=1.0.9
yarn.resolution.@jridgewell/sourcemap-codec=1.6.0
yarn.resolution.acorn=8.19.0
yarn.resolution.es-module-lexer=2.3.2
yarn.resolution.minimizer-webpack-plugin=5.13.1
yarn.resolution.schema-utils=4.8.1
yarn.resolution.update-browserslist-db=1.3.4
yarn.resolution.watchpack=2.6.3
yarn.resolution.@types/node=26.6.5
yarn.resolution.baseline-browser-mapping=2.11.33
yarn.resolution.browserslist=4.29.5
yarn.resolution.caniuse-lite=1.0.30001819
yarn.resolution.electron-to-chromium=1.5.465
yarn.resolution.enhanced-resolve=5.26.0
yarn.resolution.mime-db=1.54.0
yarn.resolution.node-releases=2.0.60
yarn.resolution.terser=5.51.2
yarn.resolution.terser-webpack-plugin=5.6.1
yarn.resolution.webpack-sources=3.6.0
yarn.resolution.follow-redirects=1.16.0
yarn.resolution.lodash=4.18.1
yarn.resolution.ajv=8.20.0
yarn.resolution.brace-expansion=5.0.12
yarn.resolution.flatted=3.4.2
yarn.resolution.picomatch=4.0.4
yarn.resolution.qs=6.16.0
yarn.resolution.socket.io-parser=4.2.7
yarn.resolution.ua-parser-js=2.0.10
yarn.resolution.ws=8.21.0
yarn.resolution.tmp=0.2.7
yarn.resolution.body-parser=2.3.0
yarn.resolution.js-yaml=4.3.2


# NodeJsRootExtension pinned packages
# node.webpack.version removed: webpack is sourced from
# kotlin-js-store/package.json in build.gradle.kts so Dependabot owns it.
node.webpackCli.version=7.2.3
node.karma.version=npm:karma-maintained@6.4.8
# Mocha 12 stable makes reporters.Base an ES class; kotlin-web-helpers (through
# 3.5.4) calls Base.call(this, runner) and crashes. Stay on the last beta.
node.mocha.version=12.0.0-beta-10
node.kotlinWebHelpers.version=3.1.0

# Lint plugins
versions.detekt=2.0.0-alpha.6
versions.ktlint=14.2.0
versions.ktlintEngine=1.8.0
versions.vanniktech=0.37.0
kotlin.languageVersion=2.4
kotlin.apiVersion=2.4
kotlin.mpp.enableCInteropCommonization=true
kotlin.swift-export.experimental.nowarn=true

# ============================================================================
# Native C bindings (FFI/ABI/N-API/JNI) — opt-in per project.
# ----------------------------------------------------------------------------
project.ffi.native=false
project.ffi.jvm=false
project.ffi.napi=false
project.ffi.name=Ffi
# Comma-separated source patterns excluded while the corresponding FFI channel is disabled.
project.ffi.napi.kotlinExcludes=io/github/kotlinmania/template/**
project.ffi.jvm.kotlinExcludes=io/github/kotlinmania/template/internal/**
# Optional host JNI payload slugs (macos-aarch64,linux-x86_64,linux-aarch64,windows-x86_64);
# empty derives required JNI payloads from enabled desktop native targets.
project.ffi.jvm.hosts=
# Optional extra Windows JNI linker libraries appended after -lws2_32 (e.g. oleaut32,user32,advapi32).
project.ffi.jvm.windowsLibraries=
# Optional configured Native target names. Empty keeps all Native targets.
project.ffi.native.targets=
# false permits .def-only bindings to system libraries/frameworks.
project.ffi.native.compileWrapper=true
# Optional paths relative to the jsMain Kotlin source root; excluded only while
# project.ffi.napi=false. Empty preserves the namespace/FFI-name convention.
project.ffi.napi.kotlinSources=

# Comma-separated extra Kotlin compiler arguments for this repo.
project.kotlin.freeCompilerArgs=

# Comma-separated guest directories preopened for wasmWasiNodeTest (KT-65179).
project.wasmWasi.testPreopens=

# Comma-separated test name patterns skipped in js/wasmJs browser test runs.
project.js.browserTestExcludes=

# Comma-separated test name patterns skipped in wasmWasi Node test runs on Windows hosts.
project.wasmWasi.windowsTestExcludes=

# Public signature dependencies only; keep private/platform dependencies in their source sets.
project.dependencies.commonMainApiBundle=

# ============================================================================
# Swift Export & Native Binary Configuration
# ============================================================================
project.swiftExport.enabled=false
project.swiftExport.moduleName=
project.swiftExport.rootPackage=
project.swiftExport.flattenPackage=
project.swiftExport.enableCoroutinesSupport=true
project.swiftExport.exportApiBundle=false
project.swiftExport.exports=
project.swiftExport.hidden=
project.swiftExport.freeCompilerArgs=
project.swiftExport.linkTask.freeCompilerArgs=
versions.swiftExportEmbeddable=2.4.20-km.5
project.native.releaseLinkTask.freeCompilerArgs=
project.native.executable.entryPoint=
project.native.executable.baseName=
project.native.executable.targets=macosArm64,linuxX64,linuxArm64,mingwX64
project.apple.framework.enabled=false
project.apple.framework.static=false
project.native.sharedLib=true
