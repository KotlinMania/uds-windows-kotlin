name: CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target family to run (matches src/ hierarchy)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows
          - jvm
          - js
      platform:
        description: "Platform runner / architecture slice"
        required: false
        default: "mingwX64"
        type: choice
        options:
          - all
          - mingwX64
      phase:
        description: "Execution phase (build, test, or both)"
        required: false
        default: "build-and-test"
        type: choice
        options:
          - build-and-test
          - build-only
          - test-only

permissions:
  contents: read

jobs:
  windows:
    if: >-
      (inputs.target == '' || inputs.target == 'all' || inputs.target == 'windows') &&
      (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'mingwX64')
    uses: ./.github/workflows/windows.yml
    with:
      platform: mingwX64
      phase: ${{ inputs.phase || 'build-and-test' }}
    permissions:
      contents: read

  jvm:
    if: >-
      (inputs.target == '' || inputs.target == 'all' || inputs.target == 'jvm') &&
      (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'mingwX64')
    uses: ./.github/workflows/jvm.yml
    with:
      platform: mingwX64
      phase: ${{ inputs.phase || 'build-and-test' }}
    permissions:
      contents: read

  js:
    if: >-
      (inputs.target == '' || inputs.target == 'all' || inputs.target == 'js') &&
      (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'mingwX64')
    uses: ./.github/workflows/js.yml
    with:
      platform: mingwX64
      phase: ${{ inputs.phase || 'build-and-test' }}
    permissions:
      contents: read
